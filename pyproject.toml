[project]
name = "supermimickit"
version = "0.1.0"
description = "Unofficial SuperMimic reproduction and multi-embodiment toolkit"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.26", "scipy>=1.12"]
[project.optional-dependencies]
tracking = ["swanlab==0.10.2"]
test = ["pytest>=8"]
web-refresh = ["nodejs-wheel==24.19.0", "onnx==1.20.1", "onnxruntime==1.24.3"]
retarget-io = ["mujoco>=3.2"]
mjwarp = ["mujoco==3.8.0", "mujoco-warp==3.8.0.3", "warp-lang==1.18.0"]
qc = ["matplotlib>=3.8", "imageio[ffmpeg]>=2.34"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["supermimic*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
